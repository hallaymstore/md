<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#169b68"><title>MD — internet mavjud emas</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(145deg,#f8fdf9,#eaf7ef);font-family:Segoe UI,Arial,sans-serif;color:#173b2a;padding:22px}.box{width:min(560px,100%);background:#fff;border:1px solid #d6ecdf;border-radius:24px;padding:30px;box-shadow:0 24px 70px rgba(25,114,76,.13);text-align:center}.logo{width:72px;height:72px;margin:auto;border-radius:22px;background:linear-gradient(145deg,#12885b,#55c991);color:#fff;display:grid;place-items:center;font-weight:900;font-size:26px}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#d9a126;margin-right:7px}h1{font-size:25px;margin:18px 0 8px}p{color:#6b8578;line-height:1.6}button,a{display:inline-flex;justify-content:center;align-items:center;border:0;border-radius:12px;padding:11px 15px;background:#169b68;color:#fff;font-weight:750;text-decoration:none;cursor:pointer}.note{margin-top:18px;padding:12px;border-radius:13px;background:#f1faf5;color:#4f7361;font-size:12px}</style></head><body><main class="box"><div class="logo">MD</div><h1><span class="dot"></span>Internet aloqasi yo‘q</h1><p>Avval ochilgan ayrim sahifalar qurilmada mavjud bo‘lsa, orqaga qaytib ulardan foydalanishingiz mumkin. Oddiy matnli o‘zgarishlar offline navbatga saqlanadi va internet qaytgach yuboriladi.</p><button onclick="location.reload()">Qayta tekshirish</button><div class="note">Fayl yuklash va serverdan yangi ma’lumot olish uchun internet kerak bo‘ladi.</div></main></body></html>
